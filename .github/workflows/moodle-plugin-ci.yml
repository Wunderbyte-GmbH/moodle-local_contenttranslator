name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  # Determines how big the test matrix should be.
  # Full matrix (all Moodle branches x all databases) only for the integration
  # branches listed in FULL_BRANCHES and for pull requests targeting them.
  # Every other branch/commit gets a reduced matrix (3 combinations).
  matrix_scope:
    name: determine CI scope
    runs-on: ubuntu-latest
    outputs:
      # One entry per call of the reusable workflow for Moodle 5.x. An empty
      # database means "run every database the matrix offers for that branch".
      matrix_5x: ${{ steps.scope.outputs.matrix_5x }}
      # Database filter for the Moodle 4.5 call, empty = all databases.
      database_405: ${{ steps.scope.outputs.database_405 }}
    steps:
      - id: scope
        env:
          # Branches that always get the complete matrix.
          FULL_BRANCHES: "main"
          # On pull_request this is the target branch, on push the pushed branch.
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          full=false
          for branch in $FULL_BRANCHES; do
            if [ "$TARGET_BRANCH" = "$branch" ]; then
              full=true
            fi
          done

          if [ "$full" = "true" ]; then
            # Full matrix: 5.0/5.1/5.2 on every database (7 jobs) plus 4.5 on
            # every database (3 jobs).
            matrix_5x='[{"moodle_branches":"MOODLE_500_STABLE MOODLE_501_STABLE MOODLE_502_STABLE","database":""}]'
            database_405=""
          else
            # Reduced matrix, 3 combinations in total:
            #   MOODLE_502_STABLE - pgsql   - php 8.3
            #   MOODLE_501_STABLE - mariadb - php 8.4  (matrix has no mysqli for 5.1)
            #   MOODLE_405_STABLE - mysqli  - php 8.1
            matrix_5x='[{"moodle_branches":"MOODLE_502_STABLE","database":"pgsql"},{"moodle_branches":"MOODLE_501_STABLE","database":"mariadb"}]'
            database_405="mysqli"
          fi

          echo "Target branch: $TARGET_BRANCH -> full matrix: $full"
          echo "matrix_5x=$matrix_5x" >> "$GITHUB_OUTPUT"
          echo "database_405=$database_405" >> "$GITHUB_OUTPUT"

  moodle500to502:
    needs: matrix_scope
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix_scope.outputs.matrix_5x) }}
    uses: Wunderbyte-GmbH/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      # Change these based on your plugin's requirements
      disable_release: true  # Use true if using the tag-based release workflow
      # Branches and database come from the matrix_scope job above.
      moodle_branches: ${{ matrix.moodle_branches }}
      database: ${{ matrix.database }}
      min_php: '8.2'  # Optional: Set minimum PHP version

      # Command to install more dependencies
      extra_plugin_runners: |
        moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-filter_contenttranslator

      # If you need to ignore specific paths (third-party libraries are ignored by default)

      # Specify paths to ignore for mustache lint

      # Specify paths to ignore for code checker
      # codechecker_ignore_paths: 'OpenTBS, TinyButStrong'

      # Specify paths to ignore for PHPDoc checker
      # phpdocchecker_ignore_paths: 'OpenTBS, TinyButStrong'

      # If you need to disable specific tests
      # disable_phpcpd: true
      # disable_mustache: true
      # disable_phpunit: true
      # disable_grunt: true
      # disable_phpdoc: true
      # disable_phpcs: true
      # disable_phplint: true
      # disable_ci_validate: true

      # If you need to enable PHPMD
      enable_phpmd: true

      # For strict code quality checks
      codechecker_max_warnings: 0

      workarounds: |
        # Set additional environment variables
        # echo "SOME_PATHS=OpenTBS, TinyButStrong" >> $GITHUB_ENV

        # WORKAROUND 24/07/2026: moodle-plugin-ci codechecker passes every plugin
        # PHP file as an argument; Symfony Process flattens the command into a
        # single 'sh -c' string, which counts as ONE argument against the Linux
        # per-argument limit MAX_ARG_STRLEN (128 KiB). With Moodle 5.1+ the
        # plugin lives under moodle/public/, pushing the string over the limit:
        # proc_open fails with "Unable to launch a new process" (Process.php:356).
        # Patch the installed moodle-plugin-ci to pass files via phpcs --file-list.
        # Remove once fixed upstream in moodlehq/moodle-plugin-ci.
        perl -0pi -e 's/foreach \(\$files as \$file\) \{\n            \$cmd\[\] = \$file;\n        \}/\$fileList = \$this->tempFile . "-file-list";\n        file_put_contents(\$fileList, implode(PHP_EOL, \$files));\n        \$cmd[] = "--file-list=" . \$fileList;/s' "$GITHUB_WORKSPACE/m-ci/src/Command/CodeCheckerCommand.php"
        grep -q -- '--file-list' "$GITHUB_WORKSPACE/m-ci/src/Command/CodeCheckerCommand.php" && echo "codechecker patched to use --file-list" || { echo "codechecker --file-list patch FAILED - check moodle-plugin-ci upstream"; exit 1; }
        # END OF WORKAROUND 24/07/2026

        # WORKAROUND 03/08/2026: moodle-plugin-ci phpdoc passes all plugin files
        # as ONE comma-joined '-p=' argument; with Moodle 5.1+ public/ paths this
        # exceeds MAX_ARG_STRLEN (mod_booking: 131396 > 131072 bytes). On
        # PHP >= 8.3 proc_open (posix_spawn) fails hard ("Unable to launch a new
        # process", Process.php:356), which also skips the cleanup that removes
        # local_moodlecheck from the Moodle tree and thereby breaks phpunit AND
        # behat ("environment was initialised for different version"). On
        # PHP <= 8.2 the exec failure was swallowed and phpdoc silently checked
        # nothing. moodlecheck.php has no --file-list option, but -p accepts a
        # directory and recurses; the plugin has no PHP files in ignored dirs,
        # so passing the plugin directory checks the identical file set.
        # Remove once fixed upstream in moodlehq/moodle-plugin-ci.
        perl -0pi -e "s/implode\(',', \\\$files\)/\\\$this->plugin->directory/" "$GITHUB_WORKSPACE/m-ci/src/Command/PHPDocCommand.php"
        grep -q -- "this->plugin->directory" "$GITHUB_WORKSPACE/m-ci/src/Command/PHPDocCommand.php" && echo "phpdoc patched to pass plugin directory" || { echo "phpdoc directory patch FAILED - check moodle-plugin-ci upstream"; exit 1; }
        # END OF WORKAROUND 03/08/2026

  moodle405:
    needs: matrix_scope
    uses: Wunderbyte-GmbH/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      # Change these based on your plugin's requirements
      disable_release: true  # Use true if using the tag-based release workflow
      moodle_branches: "MOODLE_405_STABLE"  # Optional: Only test specific Moodle versions
      # Empty = all databases of the matrix, see the matrix_scope job above.
      database: ${{ needs.matrix_scope.outputs.database_405 }}
      min_php: '8.1'  # Optional: Set minimum PHP version

      # Command to install more dependencies
      extra_plugin_runners: |
        moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-filter_contenttranslator

      # If you need to ignore specific paths (third-party libraries are ignored by default)

      # Specify paths to ignore for mustache lint

      # Specify paths to ignore for code checker
      # codechecker_ignore_paths: 'OpenTBS, TinyButStrong'

      # Specify paths to ignore for PHPDoc checker
      # phpdocchecker_ignore_paths: 'OpenTBS, TinyButStrong'

      # If you need to disable specific tests
      # disable_phpcpd: true
      # disable_mustache: true
      # disable_phpunit: true
      # disable_grunt: true
      # disable_phpdoc: true
      # disable_phpcs: true
      # disable_phplint: true
      # disable_ci_validate: true

      # If you need to enable PHPMD
      enable_phpmd: true

      # For strict code quality checks
      codechecker_max_warnings: 0

      workarounds: |
        # Set additional environment variables
        # echo "SOME_PATHS=OpenTBS, TinyButStrong" >> $GITHUB_ENV

        # WORKAROUND 24/07/2026: moodle-plugin-ci codechecker passes every plugin
        # PHP file as an argument; Symfony Process flattens the command into a
        # single 'sh -c' string, which counts as ONE argument against the Linux
        # per-argument limit MAX_ARG_STRLEN (128 KiB). With Moodle 5.1+ the
        # plugin lives under moodle/public/, pushing the string over the limit:
        # proc_open fails with "Unable to launch a new process" (Process.php:356).
        # Patch the installed moodle-plugin-ci to pass files via phpcs --file-list.
        # Remove once fixed upstream in moodlehq/moodle-plugin-ci.
        perl -0pi -e 's/foreach \(\$files as \$file\) \{\n            \$cmd\[\] = \$file;\n        \}/\$fileList = \$this->tempFile . "-file-list";\n        file_put_contents(\$fileList, implode(PHP_EOL, \$files));\n        \$cmd[] = "--file-list=" . \$fileList;/s' "$GITHUB_WORKSPACE/m-ci/src/Command/CodeCheckerCommand.php"
        grep -q -- '--file-list' "$GITHUB_WORKSPACE/m-ci/src/Command/CodeCheckerCommand.php" && echo "codechecker patched to use --file-list" || { echo "codechecker --file-list patch FAILED - check moodle-plugin-ci upstream"; exit 1; }
        # END OF WORKAROUND 24/07/2026

        # WORKAROUND 03/08/2026: moodle-plugin-ci phpdoc passes all plugin files
        # as ONE comma-joined '-p=' argument; with Moodle 5.1+ public/ paths this
        # exceeds MAX_ARG_STRLEN (mod_booking: 131396 > 131072 bytes). On
        # PHP >= 8.3 proc_open (posix_spawn) fails hard ("Unable to launch a new
        # process", Process.php:356), which also skips the cleanup that removes
        # local_moodlecheck from the Moodle tree and thereby breaks phpunit AND
        # behat ("environment was initialised for different version"). On
        # PHP <= 8.2 the exec failure was swallowed and phpdoc silently checked
        # nothing. moodlecheck.php has no --file-list option, but -p accepts a
        # directory and recurses; the plugin has no PHP files in ignored dirs,
        # so passing the plugin directory checks the identical file set.
        # Remove once fixed upstream in moodlehq/moodle-plugin-ci.
        perl -0pi -e "s/implode\(',', \\\$files\)/\\\$this->plugin->directory/" "$GITHUB_WORKSPACE/m-ci/src/Command/PHPDocCommand.php"
        grep -q -- "this->plugin->directory" "$GITHUB_WORKSPACE/m-ci/src/Command/PHPDocCommand.php" && echo "phpdoc patched to pass plugin directory" || { echo "phpdoc directory patch FAILED - check moodle-plugin-ci upstream"; exit 1; }
        # END OF WORKAROUND 03/08/2026

